name: CI Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
    types: [ opened, reopened, labeled, synchronize ]

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'labeled'
    name: Check formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3.1.1
        with:
          apps: scalafmt
      - run: scalafmt --check

  build:

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'labeled'

    strategy:
      matrix:
        scala: ['2_13', '3']
        platform: ['jvm', 'js', 'native']
        jvm: ['temurin:1.17.0.15']
      fail-fast: false

    name: "Scala: ${{ matrix.scala == '2_13' && '2.13' || '3' }} / Platform: ${{ matrix.platform }} / JVM: ${{ matrix.jvm }}"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: ${{ matrix.jvm }}
          apps: sbt
      - name: Make `sbt` run in the foreground (sbt 2 thin client starts a background server)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/sbt-foreground"; mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"; echo "$dir" >> "$GITHUB_PATH"
      - name: Install native dependencies
        if: matrix.platform == 'native'
        run: sudo apt-get update && sudo apt-get install -y libidn2-dev
      - name: "Clean, compile, test"
        run: sbt ci-${{ matrix.platform }}-${{ matrix.scala }}
